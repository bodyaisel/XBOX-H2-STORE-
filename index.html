<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XBOX-H2-STORE | متجر الألعاب والاشتراكات الفضائي</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        tajawal: ['Tajawal', 'sans-serif'],
                    },
                    colors: {
                        cosmic: {
                            bg: '#03040c',
                            card: '#0a0d26',
                            purple: '#7c3aed',
                            cyan: '#06b6d4',
                            xbox: '#107c10',
                            glow: '#3b82f6'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #03040c;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(124, 58, 237, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(16, 124, 16, 0.1) 0%, transparent 60%);
            background-attachment: fixed;
        }
        .glass-panel {
            background: rgba(10, 13, 38, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-purple:hover {
            box-shadow: 0 0 25px rgba(124, 58, 237, 0.4);
            border-color: rgba(168, 85, 247, 0.6);
        }
        .glow-cyan:hover {
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.4);
            border-color: rgba(34, 211, 238, 0.6);
        }
        .glow-xbox:hover {
            box-shadow: 0 0 25px rgba(16, 124, 16, 0.5);
            border-color: rgba(31, 172, 16, 0.8);
        }
        .duration-card-bg {
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .duration-card-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(3, 4, 12, 0.92) 20%, rgba(10, 13, 38, 0.75) 100%);
            backdrop-filter: blur(2px);
            border-radius: inherit;
        }
